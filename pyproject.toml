[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "social-read"
version = "0.1.0a1"
description = "Local read-only social research tools for existing agents"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
social-read = "social_read.cli:main"

[tool.setuptools.package-data]
social_read = ["static/*"]
