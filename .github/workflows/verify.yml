name: Install and read-only contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install:
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline behavior checks
        run: python -m unittest discover -s tests -q
      - name: Reproduce account-free walkthrough
        run: |
          python scripts/demo_research.py --output .state/demo-research.json
          diff examples/demo-research.json .state/demo-research.json
      - name: Browser-independent JavaScript check
        run: node --check social_read/static/app.js
      - name: Fresh dependency installation and Agent configuration
        run: python scripts/verify_clean_install.py --output .state/clean-install.json
      - uses: actions/upload-artifact@v4
        with:
          name: clean-install-${{ matrix.os }}
          path: .state/clean-install.json
          if-no-files-found: error
